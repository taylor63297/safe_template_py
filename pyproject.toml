[project]
name = "safe-template-py"
version = "0.1.1"
description = "Template renderer that replaces named placeholders with values from a mapping without any logic or expressions."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
